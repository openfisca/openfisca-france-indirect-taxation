[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenFisca-France-Indirect-Taxation"
version = "0.5.3"
description = "France specific indirect taxation model for OpenFisca -- a versatile microsimulation free software."
readme = "README.md"
license = {text = "GNU Affero General Public License v3"}
authors = [
  {name = "OpenFisca Team", email = "contact@openfisca.fr"}
]
keywords = ["benefit", "france", "indirect", "microsimulation", "social", "tax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numexpr",
    "OpenFisca-Core >= 43, < 45",
    "pandas >= 2.0.3, < 3.0",
    "python-slugify >= 8.0.1, < 9.0",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/openfisca/openfisca-france-indirect-taxation"
Repository = "https://github.com/openfisca/openfisca-france-indirect-taxation"
Source = "https://github.com/openfisca/openfisca-france-indirect-taxation"

[project.scripts]
build-survey-data = "openfisca_france_indirect_taxation.scripts.build_survey_data:main"

[project.optional-dependencies]
dev = [
    "autopep8 >= 2.0.2, < 3.0",
    "ipdb >= 0.13.13, < 0.14.0",
    "ruff >= 0.2.0",
    "matplotlib >= 3.7.1, < 4.0",
    "nbconvert >= 7.2.10, < 8.0",
    "OpenFisca-Survey-Manager",
    "ruamel.yaml >= 0.17.21, < 0.18.0",
    "seaborn >= 0.12.2, < 0.13.0",
    "statsmodels >= 0.14.6, < 0.15.0",
    "xlrd >= 2.0.1, < 3.0",
    "openpyxl",
]

[tool.pytest.ini_options]
addopts = "--showlocals --exitfirst --doctest-modules --disable-pytest-warnings"
testpaths = ["openfisca_france_indirect_taxation/tests"]
python_files = ["**/*.py"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true

[tool.bdist_wheel]
universal = true

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "openfisca_france_indirect_taxation/examples/benjello_candidates_to_removal",
]

[tool.ruff.lint]
ignore = [
    "E501",
    "F403",
    "F405",
]
