documentation: |-
  La taxe intérieure de consommation sur les charbons (TICC) devient la fraction prélevée sur les charbons de l'accise sur l'énergie. 
  Le Code des impositions des biens et services est créé, et absorbe les articles du code des douanes pertinents. La valeur de la taxe n'est pas affectée.
