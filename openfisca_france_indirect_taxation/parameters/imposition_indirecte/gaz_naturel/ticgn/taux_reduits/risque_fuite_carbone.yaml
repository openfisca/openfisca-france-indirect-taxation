  notes:
    2015-01-01:
    - title: Le taux réduit qui s'applique aux entreprises exposée au risque de fuite de carbone est équivalent à la valeur du tarif normal de TICGN du 31 décembre 2014, soit 1,41 euros / MWh PCI. Attention, ce taux est bien exprimé en euros / MWh PCI. En euros / MWh PCS, le taux réduit vaut 1,27 euros / MWh PCS. En 2022, le taux réduit est explicité dans le nouveau Code des impositions des biens et services. Ainsi, par souci de cohérence et de concision, on ne conserve exceptionnellement le taux *calculé*.
    2016-01-01:
    - title: La majoration s'appliquant au taux réduit (soit le tarif normal de TICGN du 31 décembre 2014, exprimé en euros / MWh PCI) s'exprime quant à elle en euros par MWh PCS. Le tarif réduit à cette date vaut donc 1,60 euros / MWh PCS. En 2022, le taux réduit est explicité dans le nouveau Code des impositions des biens et services (sans modification de sa valeur). Ainsi, par souci de cohérence et de concision, on ne conserve exceptionnellement le taux *calculé*.
    2022-01-01:
    - title: La TICGN disparaît au profit de l'accise sur les énergies (CIBS).
