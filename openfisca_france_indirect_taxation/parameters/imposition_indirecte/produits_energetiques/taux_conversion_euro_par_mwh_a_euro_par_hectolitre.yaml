description: Taux de conversion des fractions perçues en métropole sur les produits énergétiques, autres que les gaz naturels et les charbons
taux_conversion_essences:
  description: Taux de conversion des essences (€/Mwh vers €/hectolitre)
  values:
    2022-01-01:
      value: 0.889
  metadata:
    unit: /1
    last_value_still_valid_on: "2026-03-24"
    reference:
      2022-01-01:
      - href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000044603677
        title: Article L312-25 du Code des impositions sur les biens et services
      - href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000046196817
        title: Article L312-6 du Code des impositions sur les biens et services
      2023-01-01:
      - href: https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000052017288/2023-01-01
        title: Article 2-3 de l'Arrêté du 13 décembre 2022 constatant divers tarifs et seuils de régime d'impositions relatifs à certaines impositions sur les biens et services
  documentation: |
    Le taux applicable correspond à (1 / 3,6) multiplié par le coefficient exprimé en gigajoules par unité.
    (1 / 3,6) * 3,2 = 0,889
