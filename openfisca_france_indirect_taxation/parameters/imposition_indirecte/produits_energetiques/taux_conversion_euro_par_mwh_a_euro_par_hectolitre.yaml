description: Taux de conversion des fractions perçues en métropole sur les produits énergétiques, autres que les gaz naturels et les charbons
taux_conversion_essences:
  description: Taux de conversion des essences (€/Mwh vers €/hectolitre)
  values:
    2022-01-01:
      # 3,2 GJ/hL / 3.6 = 0,8888... MWh/hL
      value: 0.889
  metadata:
    last_value_still_valid_on: "2026-01-09"
    unit: /1
    reference:
        2022-01-01:
        - title: Articles L312-6 du Code des impositions sur les biens et services
          href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000046196817/2023-01-01
          note: Indique qu'il faut faire une convertion.
        - title: Article 2-2 de l'Arrêté du 13 décembre 2022
          href: https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000046888295/2023-01-01
          note: Indique la formule le facteur diviseur de 3,6, car 1 MWh = 3,6 GJ.
        - title: Article 2-3 de l'Arrêté du 13 décembre 2022
          href: https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000052017288/2023-01-01
          note: Coefficient de conversion utilisé en fonction du pouvoir calorifique, 3,2 pour l'essence.
