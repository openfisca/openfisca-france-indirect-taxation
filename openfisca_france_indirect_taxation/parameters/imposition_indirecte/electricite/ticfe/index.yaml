description: Taxe intérieure sur la consommation finale d'électricité
metadata:
  label_en: National electricity taxes
  order:
  - taux_normal
  - taux_reduits
documentation: |-
  La TICFE est créée en 2011. 
  En 2016, CSPE et TICFE fusionnent sous une appellation hybride. 
  En 2022/2023, les TCFE disparaissent et sont intégrées à l'accise sur l'électricité, qui accepte alors des taux normaux différenciés selon les types de consommateurs (professionnels, petits professionnels et non-professionnels). 
  En 2022, la TICFE est également renommée et réorganisée sous le nom de fraction de l'accise sur l'énergie, et re-codifiée au sein du nouvellement créé Code des impositions des biens et services.
