documentation: Les syndicats intercommunaux situés hors du territoire métropolitain peuvent depuis 2011 fixer le coefficient multiplicateur jusqu'à 12 (et non le seuil applicable en métropole), et affectent alors le surplus à des opérations de maîtrise de la demande d'énergie concernant les consommateurs domestiques.
